<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b0f19" />
      <stop offset="50%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>

    <!-- Warm Radiant Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="35%" stopColor="#f97316" />
      <stop offset="70%" stopColor="#ea580c" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>

    <!-- Metallic Gold Emblems -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fffbeb" />
      <stop offset="40%" stopColor="#fde68a" />
      <stop offset="75%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="radialShine" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stopColor="#f97316" stopOpacity="0.35" />
      <stop offset="100%" stopColor="#f97316" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base for App Launcher -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Inner Radiant Ambient Glow -->
  <circle cx="256" cy="240" r="180" fill="url(#radialShine)" />

  <!-- Outer Concentric Geometric Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#f97316" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="6,4" />
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-opacity="0.8" />

  <!-- Top Authority Badge -->
  <rect x="180" y="82" width="152" height="26" rx="13" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" />
  <text x="256" y="100" fill="#fde68a" font-size="12" font-weight="900" letter-spacing="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    SSA TEAM
  </text>

  <!-- Central Executive Monogram & Shield -->
  <g transform="translate(256, 260)">
    <!-- Central Star of Authority (Beacon) -->
    <path d="M 0,-102 L 9,-62 L 48,-53 L 9,-44 L 0,-4 L -9,-44 L -48,-53 L -9,-62 Z" fill="url(#goldMetal)" filter="url(#glow)" />

    <!-- Stylized "F" (Left Wing) -->
    <path d="M -90,-24 L -30,-24 C -12,-24 0,-14 0,0 C 0,14 -12,24 -30,24 L -60,24 L -60,68 L -90,68 Z" fill="url(#goldMetal)" stroke="#78350f" stroke-width="2" />
    <rect x="-60" y="-8" width="36" height="14" rx="4" fill="#0f172a" />

    <!-- Stylized "W" (Right & Central Interlock) -->
    <path d="M -12,68 L 12,68 L 32,-18 L 56,38 L 80,-18 L 98,68 L 124,68 L 96,-34 L 72,-34 L 56,12 L 40,-34 L 16,-34 Z" fill="url(#ringGrad)" stroke="#78350f" stroke-width="2" filter="url(#glow)" />
  </g>

  <!-- Base Label Ribbon -->
  <g transform="translate(256, 400)">
    <rect x="-130" y="-12" width="260" height="32" rx="16" fill="#1e293b" stroke="url(#ringGrad)" stroke-width="2" />
    <text x="0" y="10" fill="#ffffff" font-size="13.5" font-weight="900" letter-spacing="3.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      FOUNDERS PORTAL
    </text>
  </g>

  <!-- 3 Accent Stars at Bottom representing 3 Founders -->
  <g transform="translate(256, 442)">
    <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,3 -4,5 -3,1 -6,-2 -2,-2" fill="#f59e0b" />
    <polygon points="-24,-5 -22,-1 -18,-1 -21,2 -20,5 -24,3 -28,5 -27,2 -30,-1 -26,-1" fill="#f97316" />
    <polygon points="24,-5 26,-1 30,-1 27,2 28,5 24,3 20,5 21,2 18,-1 22,-1" fill="#f97316" />
  </g>
</svg>
